<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapCut - Online Video Cutter & TikTok Downloader</title>
    <meta name="description" content="SnapCut: Free online YouTube video cutter and TikTok watermark-free downloader. Cut, trim and save HD video clips in seconds.">
    <meta name="keywords" content="youtube video cutter, video trimmer, tiktok downloader without watermark, tiktok filigransız indir, youtube kesit alma, online video cutter, snapcut">
    <link rel="canonical" href="https://snapcut.tech/">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://snapcut.tech/">
    <meta property="og:title" content="SnapCut - Online Video Cutter & TikTok Downloader">
    <meta property="og:description" content="Cut YouTube clips and download watermark-free TikTok videos online with SnapCut.">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://snapcut.tech/">
    <meta property="twitter:title" content="SnapCut - Online Video Cutter & TikTok Downloader">
    <meta property="twitter:description" content="Cut YouTube clips and download watermark-free TikTok videos online with SnapCut.">

    <!-- Schema.org Application Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SnapCut",
      "url": "https://snapcut.tech",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "All",
      "description": "Free web tool to cut YouTube video sections and download TikTok clips without watermark."
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <header>
            <div class="lang-selector">
                <select id="language-select">
                    <option value="en">English</option>
                    <option value="tr">Türkçe</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ar">العربية</option>
                    <option value="hi">हिन्दी</option>
                    <option value="zh">中文</option>
                </select>
            </div>
            <h1>Snap<span class="gradient-text">Cut</span></h1>
            <p data-i18n="subtitle">Cut and download media from YouTube, TikTok in seconds.</p>
        </header>

        <main>
            <div class="glass-panel">
                <div id="player-wrapper" class="hidden">
                    
                    <div id="player-container">
                        <div id="yt-player"></div>
                    </div>

                    <!-- TikTok Iframe Container -->
                    <div id="tk-player" class="hidden" style="width:100%; aspect-ratio: 9/16; max-height: 550px; margin: 0 auto; border-radius: 12px; overflow:hidden;">
                        <iframe id="tk-iframe" src="" style="width:100%; height:100%; border:none;"></iframe>
                    </div>
                    
                    <div class="media-controls hidden" id="media-controls">
                        <button type="button" class="ctrl-btn" id="play-btn" data-i18n="playBtn">▶ Play</button>
                        <button type="button" class="ctrl-btn" id="pause-btn" data-i18n="pauseBtn">⏸ Pause</button>
                    </div>
                    
                    <div class="slider-container" id="slider-container" style="display: none;">
                        <div class="range-slider">
                            <div class="range-track"></div>
                            <div class="range-fill" id="range-fill"></div>
                            <input type="range" id="slider-start" min="0" max="100" value="0" step="1">
                            <input type="range" id="slider-end" min="0" max="100" value="100" step="1">
                        </div>
                        <div class="slider-labels">
                            <span id="label-start">00:00</span>
                            <span id="label-end">00:00</span>
                        </div>
                    </div>
                    
                    <div class="player-controls" id="time-capture-btns">
                        <button type="button" id="set-start-btn" class="time-btn" data-i18n="setStartBtn">⏱️ Set Current Time as Start</button>
                        <button type="button" id="set-end-btn" class="time-btn" data-i18n="setEndBtn">⏱️ Set Current Time as End</button>
                    </div>
                </div>
                
                <form id="cutter-form">
                    <div class="input-group">
                        <label for="url" data-i18n="urlLabel">Media Link (YouTube, TikTok)</label>
                        <input type="url" id="url" name="url" placeholder="Paste link here..." required>
                        <div id="platform-badge" class="badge hidden"></div>
                    </div>

                    <div class="input-group" id="tiktok-mode-group" style="display: none;">
                        <label data-i18n="tiktokModeLabel">Download Option</label>
                        <div class="radio-group">
                            <label><input type="radio" name="tkMode" value="full" checked> <span data-i18n="tkFull">Full Video</span></label>
                            <label><input type="radio" name="tkMode" value="cut"> <span data-i18n="tkCut">Cut Section</span></label>
                        </div>
                    </div>

                    <div class="time-inputs" id="time-options">
                        <div class="input-group">
                            <label for="startTime" data-i18n="startLabel">Start Time</label>
                            <input type="text" id="startTime" name="startTime" placeholder="00:00" pattern="^([0-9]{2,}):([0-5][0-9])$">
                        </div>
                        <div class="input-group">
                            <label for="endTime" data-i18n="endLabel">End Time</label>
                            <input type="text" id="endTime" name="endTime" placeholder="00:00" pattern="^([0-9]{2,}):([0-5][0-9])$">
                        </div>
                    </div>

                    <button type="submit" id="submit-btn">
                        <span class="btn-text" data-i18n="submitBtnDefault">Start Process</span>
                        <div class="loader" id="loader"></div>
                    </button>
                </form>
                
                <div id="status-message" class="hidden"></div>
            </div>

            <!-- Reklam Alanı (Adsterra) -->
            <div class="ad-container" style="margin: 25px auto 0; text-align: center; max-width: 100%; overflow: hidden;">
                <!-- Masaüstü 728x90 Banner -->
                <div class="ad-desktop" style="display: block; margin: 0 auto;">
                    <script type="text/javascript">
                      atOptions = {
                        'key' : '391e610ac2c9651adda2f991677434af',
                        'format' : 'iframe',
                        'height' : 90,
                        'width' : 728,
                        'params' : {}
                      };
                    </script>
                    <script type="text/javascript" src="https://bauval.org/22/391e610ac2c9651adda2f991677434af"></script>
                </div>

                <!-- Mobil / Kare 300x250 Banner -->
                <div class="ad-mobile" style="display: block; margin: 15px auto 0;">
                    <script type="text/javascript">
                      atOptions = {
                        'key' : '3f263a4c274052ed655b50b774ea0977',
                        'format' : 'iframe',
                        'height' : 250,
                        'width' : 300,
                        'params' : {}
                      };
                    </script>
                    <script type="text/javascript" src="https://bauval.org/22/3f263a4c274052ed655b50b774ea0977"></script>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js?v=4"></script>
</body>
</html>
